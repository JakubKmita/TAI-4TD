<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona Główna</title>
    <style>
        /* 1. Centrowanie zawartości */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 2. Karta główna */
        .welcome-card {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* 3. Stylizacja linków jako przycisków */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Odstęp między przyciskami */
        }

        .btn {
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, background-color 0.3s;
        }

        /* Przycisk logowania */
        .btn-login {
            background-color: #3498db;
            color: white;
        }

        .btn-login:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        /* Przycisk rejestracji */
        .btn-register {
            background-color: #2ecc71;
            color: white;
        }

        .btn-register:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>Witaj na stronie</h1>
        
        <div class="nav-links">
            <a href="log_strona.html" class="btn btn-login">Zaloguj się</a>
            <a href="rej_strona.html" class="btn btn-register">Zarejestruj się</a>
        </div>
    </div>

</body>
</html>
