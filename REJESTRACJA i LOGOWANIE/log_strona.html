<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie</title>
    <style>
        /* 1. Reset i wyśrodkowanie na środku ekranu */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* Środek w poziomie */
            align-items: center;     /* Środek w pionie */
            height: 100vh;           /* Pełna wysokość okna */
            background-color: #f4f7f6; /* Jasnoszare tło */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 2. Stylizacja ramki formularza */
        form {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid #e1e1e1;
            width: 100%;
            max-width: 320px; /* Maksymalna szerokość ramki */
        }

        /* Tytuł nad polami */
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* 3. Stylizacja etykiet i pól tekstowych */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px 0; /* Odstęp pod polem */
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box; /* Kluczowe: padding nie powiększa pola */
            font-size: 14px;
        }

        /* 4. Stylizacja przycisku wysyłania */
        input[type="submit"] {
            width: 100%;
            background-color: #4CAF50; /* Zielony kolor */
            color: white;
            padding: 14px 20px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #45a049; /* Ciemniejszy zielony po najechaniu */
        }
    </style>
</head>
<body>

    <form action="log_skrypt.php" method="POST">
        <h2>Logowanie</h2>
        
        Login: 
        <input type="text" name="login" required>
        
        Hasło: 
        <input type="password" name="password" autocomplete="off" required>
        
        <input type="submit" name="Send" value="Zaloguj się">
    </form>

</body>
</html>
